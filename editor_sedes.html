<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Sedes - MACs</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .table-custom {
            background-color: white;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background-color: #1b396b !important;
            color: white !important;
            white-space: nowrap;
        }
        td {
            vertical-align: middle;
            white-space: nowrap;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        td:hover {
            white-space: normal;
            word-break: break-word;
            overflow: visible;
        }
        .status-credential-icon {
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        .status-credential-icon.connected {
            color: #28a745;
            filter: drop-shadow(0 0 6px #28a745);
        }
        .status-credential-icon.disconnected {
            color: #dc3545;
            filter: drop-shadow(0 0 6px #dc3545);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-id-card me-2 status-credential-icon disconnected" id="statusCredentialIcon" title="Estado de Conexión"></i>
                <span>Directorio MACs (Cloud)</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm fw-bold" type="button" onclick="abrirEdicion(-1)">
                    <i class="fas fa-plus-circle me-1"></i> Nueva Sede
                </button>
                <a href="index.html" class="btn btn-outline-light btn-sm fw-bold">
                    <i class="fas fa-arrow-left me-1"></i> Volver al Sistema
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid my-4">
        <h4 class="mb-3 text-primary fw-bold"><i class="fas fa-table me-2"></i>Gestor Maestro de Sedes (Sincronizado con Firebase)</h4>
        
        <div class="table-responsive table-custom">
            <table class="table table-hover table-striped table-bordered mb-0" id="tablaSedes">
                <thead>
                    <tr id="theadSedesTr">
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodySedes">
                    <tr><td colspan="23" class="text-center text-muted py-4">Cargando sedes desde la nube...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Editar Registro -->
    <div class="modal fade" id="modalEditar" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="modalTituloSede">Editar Registro de Sede</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editIndex">
                    <div class="row g-2" id="formCampos">
                        <!-- Campos generados dinámicamente -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarEdicion()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK (Módulo) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6jvnsXZwF2anOJo3VadfNvn7Fl6Z5efY",
            authDomain: "sistema-mac-reportes.firebaseapp.com",
            databaseURL: "https://sistema-mac-reportes-default-rtdb.firebaseio.com",
            projectId: "sistema-mac-reportes",
            storageBucket: "sistema-mac-reportes.firebasestorage.app",
            messagingSenderId: "776250701305",
            appId: "1:776250701305:web:ac542564b7f7a136cef928"
        };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Indicador de conexión en el menú superior
        const connectedRef = ref(database, ".info/connected");
        onValue(connectedRef, (snap) => {
            const icon = document.getElementById('statusCredentialIcon');
            if (snap.val() === true) {
                icon.classList.remove('disconnected');
                icon.classList.add('connected');
                icon.title = "Conectado a Firebase (En línea)";
            } else {
                icon.classList.remove('connected');
                icon.classList.add('disconnected');
                icon.title = "Desconectado de Firebase (Fuera de línea)";
            }
        });

        // Columnas exactas del catálogo
        const columnas = [
            "identificador sede", "CVE ENT", "CVE DTO", "CVE MPO", "NOMBRE MUNICIPIO", "CVE DE MODULO", 
            "TIPO DE MODULO", "SECCION SEDE", "TIPO SECCION", "CVE LOCALIDAD", "NOMBRE LOCALIDAD", 
            "DIRECCION", "MZ", "CODIGO POSTAL", "REFERENCIAS", "DIAS DE FUNCIONAMIENTO", "HORARIO", 
            "CONFIGURACION", "COORDENADAS", "TURNO MATUTINO", "TURNO VESPERTINO", "X", "Y"
        ];

        let catalogoSedes = [];

        function renderHeader() {
            const tr = document.getElementById('theadSedesTr');
            let html = `<th>Acciones</th>`;
            columnas.forEach(col => {
                html += `<th>${col}</th>`;
            });
            tr.innerHTML = html;
        }

        // Sincronizar datos en tiempo real desde Firebase
        onValue(ref(database, 'catalogoSedes'), (snapshot) => {
            const data = snapshot.val();
            catalogoSedes = data ? data : [];
            renderTabla();
        });

        function renderTabla() {
            const tbody = document.getElementById('tbodySedes');
            tbody.innerHTML = '';
            
            if (catalogoSedes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columnas.length + 1}" class="text-center text-muted py-4">No hay sedes registradas en la nube.</td></tr>`;
                return;
            }

            catalogoSedes.forEach((fila, index) => {
                let htmlFila = `<tr>`;
                htmlFila += `
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="window.abrirEdicion(${index})" title="Editar"><i class="fas fa-pencil-alt"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="window.eliminarFila(${index})" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
                    </td>`;
                
                columnas.forEach((_, colIndex) => {
                    const val = fila[colIndex] !== undefined ? fila[colIndex] : "";
                    htmlFila += `<td>${val}</td>`;
                });
                
                htmlFila += `</tr>`;
                tbody.innerHTML += htmlFila;
            });
        }

        window.abrirEdicion = function(index) {
            document.getElementById('editIndex').value = index;
            const camposContainer = document.getElementById('formCampos');
            camposContainer.innerHTML = '';
            
            const datos = index === -1 ? new Array(columnas.length).fill("") : catalogoSedes[index];
            document.getElementById('modalTituloSede').innerText = index === -1 ? "Registrar Nueva Sede" : "Editar Registro de Sede";
            
            columnas.forEach((columna, colIndex) => {
                const valor = datos[colIndex] !== undefined ? datos[colIndex] : "";
                camposContainer.innerHTML += `
                    <div class="col-md-3 mb-2">
                        <label class="form-label fw-bold text-muted small mb-0">${columna}</label>
                        <input type="text" class="form-control form-control-sm border-primary" id="inputCol_${colIndex}" value="${valor}">
                    </div>
                `;
            });
            
            new bootstrap.Modal(document.getElementById('modalEditar')).show();
        };

        window.guardarEdicion = async function() {
            const index = parseInt(document.getElementById('editIndex').value);
            
            let nuevaFila = [];
            columnas.forEach((_, colIndex) => {
                const nuevoValor = document.getElementById(`inputCol_${colIndex}`).value;
                nuevaFila.push(nuevoValor);
            });
            
            if (index === -1) {
                catalogoSedes.push(nuevaFila);
            } else {
                catalogoSedes[index] = nuevaFila;
            }
            
            try {
                // Guarda en Firebase y actualiza instantáneamente en el index y la nube
                await set(ref(database, 'catalogoSedes'), catalogoSedes);
                bootstrap.Modal.getInstance(document.getElementById('modalEditar')).hide();
                alert("¡Sede guardada y sincronizada en la nube con éxito!");
            } catch (e) {
                console.error("Error al guardar en Firebase:", e);
                alert("Hubo un error al guardar los cambios en la nube.");
            }
        };

        window.eliminarFila = async function(index) {
            if(confirm("¿Estás seguro de eliminar este registro de sede?")) {
                catalogoSedes.splice(index, 1);
                try {
                    const payload = catalogoSedes.length > 0 ? catalogoSedes : null;
                    await set(ref(database, 'catalogoSedes'), payload);
                    alert("¡Sede eliminada de la nube con éxito!");
                } catch (e) {
                    console.error("Error al eliminar en Firebase:", e);
                    alert("Hubo un error al eliminar el registro.");
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderHeader();
        });
    </script>
</body>
</html>
